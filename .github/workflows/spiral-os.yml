name: Spiral OS Kernel

on:
  push:
    branches: ["main", "feature/spiral-os-kernel"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spiral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d spiral_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d spiral_test -f database/migrations/001_spiral_os_kernel.sql
      - run: npm run typecheck
      - run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/spiral_test npm test
